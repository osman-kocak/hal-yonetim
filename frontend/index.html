<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ana ekran ikonu. SVG favicon'u iPadOS kullanmıyor; PNG yoksa
         Web Clip gri kutu olarak görünüyor. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- apple-mobile-web-app-capable BİLEREK YOK: standalone (tam ekran) modda
         iOS `window.print()` çağrısını sessizce yok sayıyor. Ana ekran ikonu
         Safari'de açılsın ki yazdırma çalışsın. MDM Web Clip profilinde de
         FullScreen=false olmalı — meta tek başına yetmez. -->
    <!-- Manifest'te display:"browser" AYNI SEBEPLE: iOS 16.4+ manifest'in
         display üyesini okuyor, "standalone" yazsak meta'yı atlatıp tam ekran
         açar ve yazdırma yine ölür. Bunun bedeli offline tarafta ödeniyor:
         standalone olmayan kurulumda Safari'nin 7 günlük storage temizliği (ITP)
         geçerli, yani iPad 7 gün hiç kullanılmazsa kuyruk silinir. Hal her gün
         çalıştığı için kabul edildi — bkz. lib/offlineDb.js baş yorumu. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <title>Hal Yönetim</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
